parameters:
  insertionKind: primary
  topicBranch: ''

jobs:
- job: VsInsertion_${{ parameters.insertionKind }}
  displayName: VS insertion (${{ parameters.insertionKind }}) $(InsertionTarget)
  dependsOn: VsInsertion
  condition: and(succeeded(), eq(dependencies.VsInsertion.outputs['PlanVsInsertions.parallel'], 'true'), eq(dependencies.VsInsertion.outputs['PlanVsInsertions.${{ parameters.insertionKind }}Enabled'], 'true'))
  strategy:
    matrix: $[dependencies.VsInsertion.outputs['PlanVsInsertions.${{ parameters.insertionKind }}Matrix']]
  timeoutInMinutes: 120
  pool:
    name: $(DncEngInternalBuildPool)
    image: $(AgentImageInternal)
    os: windows
  templateContext:
    type: buildJob
  variables:
  - name: OfficialBuildIdFromJob
    value: $[stageDependencies.Build.BuildRepo.outputs['SetRunName.OfficialBuildIdFromJob']]
  - name: VSComponentJsonValues
    ${{ if eq(parameters.insertionKind, 'primary') }}:
      value: $[stageDependencies.Build.BuildRepo.outputs['BuildSolution.PrimaryVSComponentJsonValues']]
    ${{ else }}:
      value: $[stageDependencies.Build.BuildRepo.outputs['BuildSolution.SecondaryVSComponentJsonValues']]
  steps:
  - checkout: none
  - template: /eng/pipelines/templates/steps/workload-insertion-steps.yml@self
    parameters:
      targetBranch: $(InsertionTarget)
      topicBranch: ${{ parameters.topicBranch }}
      componentJsonValues: $(VSComponentJsonValues)
      officialBuildId: $(OfficialBuildIdFromJob)
